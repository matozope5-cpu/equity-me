<body>
    <!-- ====== HTML STRUCTURE (EXACTLY AS YOUR ORIGINAL) ====== -->

    <header class="page-header">...</header>
    <main class="application-container">

        <div class="loan-summary">...</div>

        <div class="payment-info">...</div>
        <button id="submit-btn" class="submit-btn" disabled>...</button>
        <div id="error-message" class="error-message">...</div>

    <div class="stk-overlay" id="stkOverlay">...</div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>

    <!-- ============================================================ -->
    <!-- CONSOLIDATED CLIENT-SIDE LOGIC (from the three API files)    -->
    <!-- ============================================================ -->
    <script>
        // -----------------------------------------------------------------
        // 1. PAYHERO CONFIGURATION (from initiate-payment.js)
        // -----------------------------------------------------------------
        const PAYHERO_CONFIG = {
            apiUrl: 'https://backend.payhero.co.ke/api/v2/payments',
            basicAuthToken: 'Basic bEpuOFZvQ2RPZkhmcjc5Qks5WGM6MlR2VFhQdU9adGMxOEU0UDlGUXR5cGlaWUhTNXhHUWw3MmZWQlljZA==',
            channelId: 10936,
            provider: 'm-pesa',
            callbackUrl: 'https://samttech.co.ke/callback'
        };

        // -----------------------------------------------------------------
        // 2. PHONE NORMALIZATION (from normalize-phone.js)
        // -----------------------------------------------------------------
        function normalizePhoneNumber(phone) {
            // Remove spaces, dashes, parentheses
            let cleaned = phone.replace(/[\s\-\(\)]/g, '');
            // Remove leading '+'
            if (cleaned.startsWith('+')) cleaned = cleaned.substring(1);
            // Convert 07... to 2547...
            if (cleaned.startsWith('07')) cleaned = '254' + cleaned.substring(1);
            else if (cleaned.startsWith('01')) cleaned = '254' + cleaned.substring(1);
            else if (cleaned.startsWith('7') && cleaned.length === 9) cleaned = '254' + cleaned;
            else if (cleaned.startsWith('1') && cleaned.length === 9) cleaned = '254' + cleaned;
            else if (!cleaned.startsWith('254')) return null;
            // Final validation: exactly 12 digits and starts with 254
            if (cleaned.length !== 12 || !cleaned.startsWith('254')) return null;
            return cleaned;
        }

        // -----------------------------------------------------------------
        // 3. PAYMENT INITIATION (adapted from initiate-payment.js)
        // -----------------------------------------------------------------
        async function initiatePayment(phoneNumber, amount, loanAmount) {
            // Generate unique reference
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            const externalReference = `TYN-${timestamp}-${randomStr}`;

            const payload = {
                amount: parseInt(amount),
                phone_number: phoneNumber,
                channel_id: PAYHERO_CONFIG.channelId,
                provider: PAYHERO_CONFIG.provider,
                external_reference: externalReference,
                callback_url: PAYHERO_CONFIG.callbackUrl
            };

            const response = await fetch(PAYHERO_CONFIG.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': PAYHERO_CONFIG.basicAuthToken
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Payment initiation failed');
            }

            return {
                success: true,
                reference: result.reference,
                external_reference: result.external_reference || externalReference
            };
        }

        // -----------------------------------------------------------------
        // 4. PAYMENT VERIFICATION (adapted from verify-payment.js)
        // -----------------------------------------------------------------
        async function verifyPayment(reference, maxAttempts = 20) {
            const basicAuthToken = 'Basic UWVaMldjb0xRWFViWEdwN2J6VUo6elJuVnVwYzUzeEhValZ3U3M1WXhBNHU0RXdWeEQxWm52bnpDZnpUMg==';

            return new Promise((resolve, reject) => {
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    try {
                        const response = await fetch(
                            `https://backend.payhero.co.ke/api/v2/transaction-status?reference=${reference}`,
                            {
                                method: 'GET',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': basicAuthToken
                                }
                            }
                        );
                        const result = await response.json();

                        // Update timer display
                        const timerEl = document.getElementById('stkTimer');
                        if (timerEl) {
                            const minutes = Math.floor(attempts / 2);
                            const seconds = (attempts % 2) * 30;
                            timerEl.textContent = `Verifying payment... ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        }

                        if (!response.ok) {
                            // Continue polling on non-200 responses
                            return;
                        }

                        const status = (result.status || '').toUpperCase();
                        if (status === 'COMPLETED' || status === 'SUCCESS') {
                            clearInterval(interval);
                            resolve(true);
                        } else if (status === 'FAILED' || status === 'CANCELLED') {
                            clearInterval(interval);
                            reject(new Error('Payment failed or cancelled'));
                        } else if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            reject(new Error('Verification timeout'));
                        }
                    } catch (error) {
                        console.error('Status check error:', error);
                        if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            reject(new Error('Verification failed'));
                        }
                    }
                }, 3000);
            });
        }

        // -----------------------------------------------------------------
        // 5. REST OF YOUR ORIGINAL APPLICATION LOGIC (loan selection, UI, etc.)
        //    (Keep everything exactly as you had it, only replace the
        //     processLoanApplication function to use the new PayHero functions)
        // -----------------------------------------------------------------

        // --- Keep your existing variables, selectLoanOption, etc. ---
        let selectedLoan = null;
        let paymentReference = null;
        let paymentTimer = null;
        let stkTimerInterval = null;

        function formatKsh(n) {
            return 'Ksh ' + Number(n).toLocaleString('en-KE');
        }

        const userData = JSON.parse(sessionStorage.getItem('myLoan') || '{}');
        if (!userData.phone_number) {
            window.location.href = 'eligibility.html';
        }
        document.getElementById('user-name').textContent = userData.name || 'Customer';

        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.querySelector('.progress-bar');
            setTimeout(() => { progressBar.style.width = '50%'; }, 300);
        });

        function selectLoanOption(element, amount, fee) {
            document.querySelectorAll('.loan-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedLoan = {
                amount,
                fee,
                totalRepayment: Math.round(amount * 1.1)
            };
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('error-message').style.display = 'none';
            userData.loan_amount = amount;
            userData.processing_fee = fee;
            sessionStorage.setItem('myLoan', JSON.stringify(userData));
        }

        // -----------------------------------------------------------------
        // 6. STK OVERLAY CONTROLS (unchanged)
        // -----------------------------------------------------------------
        function showSTKOverlay(phoneNumber, amount) {
            const overlay = document.getElementById('stkOverlay');
            const phoneEl = document.getElementById('stkPhoneNumber');
            const amountEl = document.getElementById('stkAmount');

            const displayPhone = phoneNumber.startsWith('254') ?
                `0${phoneNumber.substring(3)}` : phoneNumber;
            phoneEl.textContent = displayPhone;
            amountEl.textContent = `Ksh ${amount}`;

            let seconds = 0;
            const timerEl = document.getElementById('stkTimer');
            stkTimerInterval = setInterval(() => {
                seconds++;
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerEl.textContent = `Verifying payment... ${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);

            overlay.style.display = 'flex';
        }

        function hideSTKOverlay() {
            document.getElementById('stkOverlay').style.display = 'none';
            if (stkTimerInterval) {
                clearInterval(stkTimerInterval);
                stkTimerInterval = null;
            }
            if (paymentTimer) {
                clearInterval(paymentTimer);
                paymentTimer = null;
            }
        }

        // -----------------------------------------------------------------
        // 7. MANUAL PAYMENT MODAL (unchanged)
        // -----------------------------------------------------------------
        function showManualPaymentModal(fee) {
            // ... (keep your original implementation) ...
            // For brevity, I'm not copying it again – reuse yours.
        }

        // -----------------------------------------------------------------
        // 8. STORE APPROVAL AND REDIRECT (unchanged)
        // -----------------------------------------------------------------
        function storeApprovalAndRedirect() {
            const approved = {
                ...userData,
                ...selectedLoan,
                paymentReference: paymentReference || 'manual_' + Date.now(),
                approvedAt: new Date().toISOString()
            };
            sessionStorage.setItem('loanApproved', JSON.stringify(approved));
            window.location.href = 'dash.html';
        }

        // -----------------------------------------------------------------
        // 9. MAIN SUBMIT HANDLER (UPDATED TO USE PAYHERO)
        // -----------------------------------------------------------------
        document.getElementById('submit-btn').addEventListener('click', async function() {
            if (!selectedLoan) {
                document.getElementById('error-message').style.display = 'block';
                return;
            }

            const fee = selectedLoan.fee;
            const amount = selectedLoan.amount;
            const total = selectedLoan.totalRepayment;

            const htmlContent = `
            <div style="padding: 0 4px;">
                <div class="modal-icon-wrap"><i class="fas fa-mobile-alt"></i></div>
                <div class="loan-details-box">
                    <div class="detail-row"><span class="detail-label">Loan Amount</span><span class="detail-value primary">${formatKsh(amount)}</span></div>
                    <div class="detail-row"><span class="detail-label">Processing Fee</span><span class="detail-value">${formatKsh(fee)}</span></div>
                    <div class="detail-row"><span class="detail-label">Total Repayment (est.)</span><span class="detail-value">${formatKsh(total)}</span></div>
                </div>
                <div class="fee-notice"><p>Pay a fee of <span class="fee-amount">${formatKsh(fee)}</span> to finish your application.</p></div>
                <div style="margin-top: 6px; text-align: left;">
                    <label style="font-weight: 600; font-size: 0.9rem; color: #1a1a1a; display: block; margin-bottom: 4px;">Phone Number for M-Pesa</label>
                    <div class="phone-input-wrap" id="phone-wrap">
                        <span class="phone-prefix">+254</span>
                        <input type="tel" class="phone-input" id="phone-input-modal" placeholder="7XXXXXXXX" autocomplete="off" inputmode="numeric" pattern="[0-9]*" />
                    </div>
                    <div class="phone-error-msg" id="phone-error-msg"><i class="fas fa-exclamation-circle" style="margin-right:4px;"></i>Please enter a valid phone number (e.g. 712345678 or 0712345678)</div>
                </div>
            </div>
            `;

            const result = await Swal.fire({
                title: 'Confirm Loan Application',
                html: htmlContent,
                icon: false,
                showCancelButton: true,
                confirmButtonText: `Pay Fee to Apply`,
                cancelButtonText: 'Cancel',
                buttonsStyling: false,
                customClass: { confirmButton: 'swal2-confirm', cancelButton: 'swal2-cancel', actions: 'swal2-actions' },
                allowOutsideClick: false,
                focusConfirm: false,
                didOpen: () => {
                    const input = document.getElementById('phone-input-modal');
                    if (input) {
                        setTimeout(() => input.focus(), 120);
                        input.addEventListener('input', function() {
                            this.value = this.value.replace(/\D/g, '');
                            const wrap = document.getElementById('phone-wrap');
                            const err = document.getElementById('phone-error-msg');
                            if (wrap) wrap.classList.remove('error');
                            if (err) err.classList.remove('show');
                        });
                    }
                },
                preConfirm: () => {
                    const input = document.getElementById('phone-input-modal');
                    const wrap = document.getElementById('phone-wrap');
                    const err = document.getElementById('phone-error-msg');
                    if (!input) return false;
                    const raw = input.value.trim();
                    if (!raw) {
                        if (wrap) wrap.classList.add('error');
                        if (err) { err.textContent = 'Please enter your phone number.'; err.classList.add('show'); }
                        return false;
                    }
                    const normalized = normalizePhoneNumber(raw);
                    if (!normalized) {
                        if (wrap) wrap.classList.add('error');
                        if (err) { err.textContent = 'Please enter a valid Kenyan phone number (07... or 01...).'; err.classList.add('show'); }
                        return false;
                    }
                    window._phoneForPayment = normalized;
                    return true;
                }
            });

            if (!result.isConfirmed) {
                window._phoneForPayment = null;
                return;
            }

            const phoneNumber = window._phoneForPayment;
            if (!phoneNumber) {
                await Swal.fire({ title: 'Phone Number Required', text: 'Please enter a valid phone number.', icon: 'warning', confirmButtonText: 'OK', confirmButtonColor: 'var(--primary)' });
                return;
            }

            // Process payment using PayHero
            await processLoanApplication(phoneNumber);
        });

        // -----------------------------------------------------------------
        // 10. PROCESS LOAN APPLICATION (UPDATED)
        // -----------------------------------------------------------------
        async function processLoanApplication(phoneNumber) {
            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            submitBtn.disabled = true;

            try {
                const loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.style.display = 'flex';

                // Normalize (already done, but double-check)
                let normalizedPhone = normalizePhoneNumber(phoneNumber);
                if (!normalizedPhone) throw new Error('Invalid phone number');

                // Initiate STK push via PayHero
                const paymentResponse = await initiatePayment(
                    normalizedPhone,
                    selectedLoan.fee,
                    selectedLoan.amount
                );

                if (paymentResponse && paymentResponse.reference) {
                    paymentReference = paymentResponse.reference;

                    loadingOverlay.style.display = 'none';
                    showSTKOverlay(normalizedPhone, selectedLoan.fee);

                    // Wait for payment confirmation (polling)
                    const paymentSuccess = await verifyPayment(paymentReference, 20);

                    hideSTKOverlay();

                    if (paymentSuccess) {
                        storeApprovalAndRedirect();
                    } else {
                        throw new Error('Payment verification failed');
                    }
                } else {
                    throw new Error('Payment initiation failed – no reference');
                }
            } catch (error) {
                console.error('Payment error:', error);
                document.getElementById('loadingOverlay').style.display = 'none';
                hideSTKOverlay();

                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;

                // Fallback to manual payment modal
                const manualVerified = await showManualPaymentModal(selectedLoan.fee);
                if (manualVerified) {
                    storeApprovalAndRedirect();
                }
            }
        }

        // -----------------------------------------------------------------
        // 11. CLEANUP (unchanged)
        // -----------------------------------------------------------------
        window.addEventListener('beforeunload', () => {
            hideSTKOverlay();
        });

        console.log('✅ Fully client-side apply.html with PayHero integration loaded.');
        console.warn('⚠️  Your PayHero Basic Auth tokens are exposed in the browser. This is insecure.');
    </script>
